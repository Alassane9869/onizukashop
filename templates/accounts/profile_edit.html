{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">

  <!-- Fil d'Ariane -->
  <div class="flex items-center gap-2 text-sm text-gray-500 mb-6">
    <a href="{% url 'shop:home' %}" class="hover:text-primary-500 transition">Accueil</a>
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
    <a href="{% url 'accounts:dashboard' %}" class="hover:text-primary-500 transition">Mon compte</a>
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
    <span class="text-gray-900 font-medium">Modifier mon profil</span>
  </div>

  <div class="bg-white rounded-3xl p-6 sm:p-8 border border-gray-100 shadow-sm max-w-2xl mx-auto">
    <div class="flex items-center justify-between pb-6 border-b border-gray-100 mb-6">
      <div>
        <h1 class="font-heading font-bold text-2xl text-gray-900">Modifier mon profil</h1>
        <p class="text-sm text-gray-500">Mettez à jour vos coordonnées personnelles</p>
      </div>
      <a href="{% url 'accounts:dashboard' %}" class="text-sm font-semibold text-gray-500 hover:text-gray-700">
        Annuler
      </a>
    </div>

    <form method="post" enctype="multipart/form-data" class="space-y-6">
      {% csrf_token %}

      <!-- Avatar Preview & Upload -->
      <div class="flex items-center gap-6" x-data="{ photoName: null, photoPreview: null }">
        <div class="relative">
          <template x-if="photoPreview">
            <img :src="photoPreview" class="w-20 h-20 rounded-full object-cover border-2 border-primary-500">
          </template>
          <template x-if="!photoPreview">
            {% if profile.avatar %}
            <img src="{{ profile.avatar.url }}" alt="{{ profile.get_full_name }}" class="w-20 h-20 rounded-full object-cover border-2 border-amber-200">
            {% else %}
            <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-primary-500 to-amber-400 text-white flex items-center justify-center font-heading font-bold text-2xl">
              {{ request.user.first_name|first|default:request.user.username|first|upper }}
            </div>
            {% endif %}
          </template>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Photo de profil</label>
          <input type="file" name="avatar" accept="image/*" class="text-xs text-gray-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-primary-600 hover:file:bg-amber-100 cursor-pointer"
            @change="
              const file = $event.target.files[0];
              if (file) {
                photoName = file.name;
                const reader = new FileReader();
                reader.onload = (e) => { photoPreview = e.target.result; };
                reader.readAsDataURL(file);
              }
            "
          >
          <p class="text-xs text-gray-400 mt-1">PNG, JPG ou WEBP jusqu'à 5 Mo.</p>
        </div>
      </div>

      <!-- Prénom & Nom -->
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Prénom</label>
          <input type="text" name="first_name" value="{{ request.user.first_name }}" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Nom</label>
          <input type="text" name="last_name" value="{{ request.user.last_name }}" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
        </div>
      </div>

      <!-- Email & Téléphone -->
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Adresse email</label>
          <input type="email" value="{{ request.user.email }}" disabled class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-gray-500 text-sm cursor-not-allowed">
          <p class="text-xs text-gray-400 mt-1">L'adresse email est associée à votre compte.</p>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Téléphone (Mali)</label>
          <input type="tel" name="phone" value="{{ profile.phone }}" placeholder="+223 00 00 00 00" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
        </div>
      </div>

      <!-- Newsletter -->
      <div class="pt-2">
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="checkbox" name="newsletter" {% if profile.newsletter %}checked{% endif %} class="w-5 h-5 rounded border-gray-300 text-primary-500 focus:ring-primary-500">
          <span class="text-sm text-gray-700">Recevoir les offres exclusives et alertes promos par SMS / Email</span>
        </label>
      </div>

      <!-- Boutons -->
      <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
        <a href="{% url 'accounts:dashboard' %}" class="px-5 py-3 rounded-xl text-sm font-semibold text-gray-600 hover:bg-gray-100 transition">
          Annuler
        </a>
        <button type="submit" class="px-6 py-3 bg-primary-500 hover:bg-primary-600 text-white font-heading font-bold text-sm rounded-xl shadow-lg shadow-amber-500/20 transition">
          Enregistrer les modifications
        </button>
      </div>

    </form>
  </div>

</div>
{% endblock %}
