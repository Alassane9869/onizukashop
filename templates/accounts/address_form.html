{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">

  <!-- Fil d'Ariane -->
  <div class="flex items-center gap-2 text-sm text-gray-500 mb-6">
    <a href="{% url 'shop:home' %}" class="hover:text-primary-500 transition">Accueil</a>
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
    <a href="{% url 'accounts:dashboard' %}" class="hover:text-primary-500 transition">Mon compte</a>
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
    <span class="text-gray-900 font-medium">Ajouter une adresse</span>
  </div>

  <div class="bg-white rounded-3xl p-6 sm:p-8 border border-gray-100 shadow-sm max-w-2xl mx-auto">
    <div class="flex items-center justify-between pb-6 border-b border-gray-100 mb-6">
      <div>
        <h1 class="font-heading font-bold text-2xl text-gray-900">Nouvelle adresse de livraison</h1>
        <p class="text-sm text-gray-500">Ajoutez une adresse pour vos futures commandes à Bamako ou région</p>
      </div>
      <a href="{% url 'accounts:dashboard' %}" class="text-sm font-semibold text-gray-500 hover:text-gray-700">
        Annuler
      </a>
    </div>

    <form method="post" class="space-y-5">
      {% csrf_token %}

      <!-- Destinataire & Téléphone -->
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Nom complet du destinataire *</label>
          <input type="text" name="full_name" required placeholder="Ex: Moussa Diarra" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Numéro de téléphone joignable *</label>
          <input type="tel" name="phone" required placeholder="+223 92 67 37 99" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
        </div>
      </div>

      <!-- Ville & Quartier -->
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Ville *</label>
          <input type="text" name="city" value="Bamako" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Quartier / Commune *</label>
          <input type="text" name="district" placeholder="Ex: Hamdallaye ACI 2000, Badalabougou..." class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm">
        </div>
      </div>

      <!-- Adresse exacte / Précisions -->
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Adresse exacte / Repères de livraison *</label>
        <textarea name="address_line" rows="3" required placeholder="Rue, porte, repère visuel (ex: à 50m de la pharmacie, face au monument...)" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm"></textarea>
      </div>

      <!-- Adresse par défaut -->
      <div class="pt-2">
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="checkbox" name="is_default" class="w-5 h-5 rounded border-gray-300 text-primary-500 focus:ring-primary-500">
          <span class="text-sm text-gray-700 font-medium">Définir comme adresse de livraison par défaut</span>
        </label>
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
        <a href="{% url 'accounts:dashboard' %}" class="px-5 py-3 rounded-xl text-sm font-semibold text-gray-600 hover:bg-gray-100 transition">
          Annuler
        </a>
        <button type="submit" class="px-6 py-3 bg-primary-500 hover:bg-primary-600 text-white font-heading font-bold text-sm rounded-xl shadow-lg shadow-amber-500/20 transition">
          Enregistrer l'adresse
        </button>
      </div>

    </form>
  </div>

</div>
{% endblock %}
