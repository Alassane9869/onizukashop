{% extends "base.html" %}
{% load static %}

{% block title %}Déconnexion • Onizouka Store Mali{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4 py-12">
  
  <div class="w-full max-w-md bg-white rounded-3xl border border-neutral-100 p-8 sm:p-10 shadow-[0_8px_30px_rgba(0,0,0,0.04)] text-center">
    
    <div class="w-14 h-14 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center mx-auto mb-4">
      <svg class="w-7 h-7 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
      </svg>
    </div>

    <h1 class="text-xl sm:text-2xl font-black text-neutral-900 tracking-tight mb-2">
      Déconnexion
    </h1>
    <p class="text-xs text-neutral-500 mb-6">
      Êtes-vous sûr de vouloir vous déconnecter de votre compte Onizouka Store ?
    </p>

    <form method="POST" action="{% url 'account_logout' %}">
      {% csrf_token %}
      <div class="space-y-3">
        <button 
          type="submit" 
          class="w-full py-3.5 px-6 rounded-2xl bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-bold text-sm shadow-md transition active:scale-[0.98]"
        >
          Confirmer la déconnexion
        </button>
        <a 
          href="{% url 'shop:home' %}" 
          class="block w-full py-2.5 px-4 text-xs font-semibold text-neutral-500 hover:text-neutral-900 hover:bg-neutral-50 rounded-xl transition"
        >
          Annuler et retourner à la boutique
        </a>
      </div>
    </form>

  </div>

</div>
{% endblock %}
